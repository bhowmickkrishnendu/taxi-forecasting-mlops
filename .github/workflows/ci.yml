# GitHub Actions CI/CD for the taxi-forecasting project.
#
# Every push and PR:
#   1. Ruff lint + pytest with the 75% coverage gate (pyproject.toml)
#   2. Terraform fmt/validate for infra/terraform (no AWS credentials needed)
#   3. PRs only: Docker build of the API image's dependency stage
#
# Push to main (after 1 and 2 pass) also deploys to AWS:
#   assume AWS_ROLE_ARN via OIDC -> pull baked model artifacts from S3 ->
#   build image -> push to ECR -> roll the ECS service -> wait until stable ->
#   check /health through the ALB.
#
# Repository variables (Settings -> Secrets and variables -> Actions -> Variables):
#   AWS_ROLE_ARN, AWS_REGION, ECR_REPOSITORY, ECS_CLUSTER, ECS_SERVICE,
#   ARTIFACTS_BUCKET, API_URL  (values come from `terraform output`).

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff lint
        run: ruff check .

      - name: Pytest with coverage
        run: pytest --cov=src --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  terraform:
    name: Terraform validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init (no backend)
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

  docker-build:
    name: Docker build (dependency stage)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build API builder stage
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: builder
          push: false
          tags: taxi-forecasting-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to AWS ECS
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [lint-test, terraform]
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE }}
      ARTIFACTS_BUCKET: ${{ vars.ARTIFACTS_BUCKET }}
      API_URL: ${{ vars.API_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Fetch baked model artifacts from S3
        run: |
          aws s3 sync "s3://$ARTIFACTS_BUCKET/mlruns" ./mlruns --only-show-errors
          aws s3 cp "s3://$ARTIFACTS_BUCKET/mlflow.db" ./mlflow.db --only-show-errors
          mkdir -p data/processed
          aws s3 cp "s3://$ARTIFACTS_BUCKET/demand_hourly.parquet" ./data/processed/demand_hourly.parquet --only-show-errors
          python3 scripts/make_mlflow_portable.py --src mlflow.db --dest mlflow.container.db --new-base "file:///app/mlruns"

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Roll the ECS service
        run: |
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" \
            --force-new-deployment --query "service.serviceName" --output text
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"

      - name: Service and container status
        run: |
          aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --query "services[0].{service:serviceName,status:status,desired:desiredCount,running:runningCount,pending:pendingCount,taskDefinition:taskDefinition}" \
            --output table
          TASKS=$(aws ecs list-tasks --cluster "$ECS_CLUSTER" --service-name "$ECS_SERVICE" --query "taskArns" --output text)
          if [ -n "$TASKS" ] && [ "$TASKS" != "None" ]; then
            aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks $TASKS \
              --query "tasks[].{task:taskArn,lastStatus:lastStatus,health:healthStatus,image:containers[0].image,started:startedAt}" \
              --output table
          else
            echo "No running tasks (desired count is 0)."
          fi

      - name: Smoke test /health through the ALB
        run: |
          DESIRED=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" --query "services[0].desiredCount" --output text)
          if [ "$DESIRED" = "0" ]; then
            echo "Desired count is 0 - image pushed, skipping health check."
            exit 0
          fi
          for i in $(seq 1 20); do
            BODY=$(curl -fsS --max-time 10 "$API_URL/health" || true)
            if echo "$BODY" | grep -q '"status":"ok"'; then
              echo "$BODY"
              {
                echo "### Deployed API is healthy"
                echo ""
                echo "- URL: $API_URL"
                echo "- Commit: \`${GITHUB_SHA}\`"
                echo "- /health: \`$BODY\`"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Waiting for healthy API ($i/20)..."
            sleep 15
          done
          echo "API did not become healthy: $BODY"
          exit 1
