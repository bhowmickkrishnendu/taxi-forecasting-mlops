# GitHub Actions CI for the taxi-forecasting project.
#
# Mirrors the quality gate in buildspec.yml (CodeBuild) so every push and PR
# gets the same checks on GitHub:
#   1. Ruff lint + pytest with the 75% coverage gate (pyproject.toml)
#   2. Terraform fmt/validate for infra/terraform (no AWS credentials needed)
#   3. Docker build of the API image's dependency stage
#
# The full API image bakes in mlruns/, mlflow.db and the demand-history parquet,
# which are gitignored, so it is built by CodeBuild (buildspec.yml) after those
# artifacts are fetched from S3. Here we only prove the Dockerfile and
# requirements build cleanly from a fresh checkout.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff lint
        run: ruff check .

      - name: Pytest with coverage
        run: pytest --cov=src --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  terraform:
    name: Terraform validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init (no backend)
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

  docker-build:
    name: Docker build (dependency stage)
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build API builder stage
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: builder
          push: false
          tags: taxi-forecasting-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
